<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personvognsteknik Duel</title><style>
:root{font-family:system-ui,sans-serif;color:#eef7ff;background:#0d1729}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:22px 16px 60px}h1{font-size:clamp(1.6rem,5vw,2.5rem);margin-bottom:4px}.muted{color:#afc5d8}.panel{background:#1b2c46;border:1px solid #344965;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 12px 28px #0002}button,input{font:inherit;border:0;border-radius:12px;padding:14px}button{background:#54dec7;color:#08212a;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:default}input{width:100%;margin:7px 0 14px;background:#fff;color:#142338}.secondary{background:#344b68;color:#fff}.answer{display:block;text-align:left;width:100%;margin:10px 0;background:#324a69;color:white}.answer.chosen{outline:2px solid #54dec7}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px}.score{text-align:center;background:#253b58;padding:18px 8px;border-radius:16px;overflow-wrap:anywhere}.score strong{display:block;font-size:2.3rem;color:#6ff0d4}.pill{display:inline-block;padding:7px 12px;background:#304867;border-radius:30px;font-size:.85rem}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.trophy{text-align:center;font-size:2rem}.error{color:#ffb2b2;min-height:24px}.good{color:#6ff0d4}code{color:#6ff0d4;font-size:1.3rem}button:focus-visible,input:focus-visible{outline:3px solid #fff}
</style></head><body><main><div class="top"><span class="pill">🔧 PERSONVOGNSTEKNIK DUEL</span><span id="round" class="pill">2 spillere</span></div><h1>Personvognsteknik Duel</h1><p class="muted">Udfordr en ven · 16 spørgsmål · én vinder</p><p id="status" class="error" role="status"></p><div id="app">Indlæser…</div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,onSnapshot,setDoc,updateDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const config={apiKey:'AIzaSyCla_rNEnK9UTQ5kNTVmVlOlORD71JjI1A',authDomain:'auto-quiz-9f924.firebaseapp.com',projectId:'auto-quiz-9f924',storageBucket:'auto-quiz-9f924.firebasestorage.app',messagingSenderId:'673795261314',appId:'1:673795261314:web:d89d4327aa8038d5bac59b'};
const el=document.querySelector('#app'),status=document.querySelector('#status'),round=document.querySelector('#round');let db,uid,questions=[],room,code='',unsub;const roomKey='pv_duel_v2_room',nameKey='pv_duel_name';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const say=s=>status.textContent=s||'';
async function call(name,data){say('');try{const ref=data.code?doc(db,'duels_v2',data.code):null;if(name==='createDuel'){let code;for(let tries=0;tries<5;tries++){code=Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');if(!(await getDoc(doc(db,'duels_v2',code))).exists())break;}await setDoc(doc(db,'duels_v2',code),{host:uid,guest:null,names:{[uid]:data.name},index:0,answers:{},scores:{[uid]:0},createdAt:Date.now()});return {code};}if(name==='joinDuel'){if(!/^[A-Z0-9]{6}$/.test(data.code))throw Error('Rumkoden skal være 6 tegn.');const snap=await getDoc(ref);if(!snap.exists())throw Error('Rummet findes ikke.');const r=snap.data();if(r.host!==uid&&r.guest!==uid){if(r.guest)throw Error('Rummet er fuldt.');await updateDoc(ref,{guest:uid,[`names.${uid}`]:data.name,[`scores.${uid}`]:0});}return {code:data.code};}if(name==='submitAnswer'){const snap=await getDoc(ref),r=snap.data();if(!r||r.index!==data.index||r.answers?.[uid]!==undefined||!r.guest)throw Error('Du kan ikke svare nu.');const q=questions[r.index];await updateDoc(ref,{[`answers.${uid}`]:data.answer,[`scores.${uid}`]:(r.scores?.[uid]||0)+(q.correct.includes(data.answer)?1:0)});return {};}if(name==='nextQuestion'){const snap=await getDoc(ref),r=snap.data();if(!r||r.host!==uid||!r.guest||r.answers?.[r.host]===undefined||r.answers?.[r.guest]===undefined)throw Error('Vent på begge svar.');await updateDoc(ref,{index:r.index+1,answers:{}});return {};}}catch(e){say(e.message||'Der skete en fejl.');throw e}}
function home(){round.textContent='2 spillere';el.innerHTML=`<div class="panel"><h2>Start en duel</h2><label for="name">Dit spillernavn</label><input id="name" maxlength="30" placeholder="Skriv dit navn" value="${esc(localStorage.getItem(nameKey)||'')}"><button id="create">Opret duel</button><hr><p>Eller deltag med en rumkode:</p><label for="code">Rumkode</label><input id="code" maxlength="6" placeholder="6 tegn" value="${esc(new URLSearchParams(location.search).get('room')||'')}"><button id="join">Deltag i duel</button></div>`;document.querySelector('#create').onclick=()=>enter(true);document.querySelector('#join').onclick=()=>enter(false)}
async function enter(create){const name=document.querySelector('#name').value.trim().slice(0,30);if(!name){say('Skriv dit navn.');return}localStorage.setItem(nameKey,name);const entered=document.querySelector('#code').value.trim().toUpperCase();try{const result=await call(create?'createDuel':'joinDuel',create?{name}:{name,code:entered});localStorage.setItem(roomKey,result.code);watch(result.code)}catch{}}
function watch(c){if(unsub)unsub();code=c;unsub=onSnapshot(doc(db,'duels_v2',c),s=>{if(!s.exists()){say('Rummet findes ikke.');return}room=s.data();render()},e=>say(e.message))}
function render(){if(!room)return;const ids=[room.host,room.guest].filter(Boolean),both=!!room.guest,i=room.index,q=questions[i],mine=room.answers?.[uid],answered=both&&ids.every(id=>room.answers?.[id]!==undefined),finished=i>=questions.length;round.textContent=finished?'Færdig':`Runde ${Math.min(i+1,questions.length)}/${questions.length}`;
let html=`<div class="panel"><div class="top"><span>Rumkode: <code>${esc(code)}</code></span><button class="secondary" id="leave">Skift rum</button></div><p class="muted">Del rumkoden eller invitationslinket med din modstander.</p><button class="secondary" id="share">Del invitation</button></div><div class="scoreboard">${ids.map(id=>`<div class="score"><div>${esc(room.names?.[id]||'Spiller')}</div><strong>${Number(room.scores?.[id]||0)}</strong><small>point</small></div>`).join('')}${!both?'<div class="score">Venter på spiller 2</div>':''}</div>`;
if(!both)html+='<div class="panel">⏳ Venter på, at spiller 2 deltager…</div>';
else if(finished){const a=room.scores?.[room.host]||0,b=room.scores?.[room.guest]||0,winner=a===b?'Uafgjort!':`${esc(room.names?.[a>b?room.host:room.guest]||'Spiller')} vinder!`;html+=`<div class="panel trophy">🏆<h2>${winner}</h2><p>Slutresultat: ${a} – ${b}</p><button id="restart">Start en ny duel</button></div>`}
else if(q){html+=`<div class="panel"><p class="muted">Spørgsmål ${i+1} af ${questions.length} · ${q.seconds} sek. anbefalet</p><h2>${esc(q.question)}</h2>${q.answers.map((a,j)=>`<button class="answer ${mine===j?'chosen':''}" data-answer="${j}" ${mine!==undefined?'disabled':''}>${j+1}. ${esc(a)}</button>`).join('')}<p class="muted">${mine===undefined?'Vælg dit svar.':answered?'Begge har svaret.':'Dit svar er gemt. Venter på den anden.'}</p>${answered?(uid===room.host?'<button id="next">Næste spørgsmål →</button>':'<p>Venter på, at værten går videre.</p>'):''}</div>`}
el.innerHTML=html;document.querySelector('#leave').onclick=()=>{localStorage.removeItem(roomKey);unsub();room=null;history.replaceState(null,'',location.pathname);home()};document.querySelector('#share').onclick=async()=>{const link=location.origin+location.pathname+'?room='+encodeURIComponent(code);if(navigator.share){try{await navigator.share({title:'Personvognsteknik Duel',text:'Spil mod mig! Rumkode: '+code,url:link});return}catch{}}try{await navigator.clipboard.writeText(link);say('Invitationslink kopieret!')}catch{say('Del rumkoden: '+code)}};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await call('submitAnswer',{code,index:i,answer:Number(b.dataset.answer)})}catch{b.disabled=false}});if(document.querySelector('#next'))document.querySelector('#next').onclick=()=>call('nextQuestion',{code}).catch(()=>{});if(document.querySelector('#restart'))document.querySelector('#restart').onclick=()=>{localStorage.removeItem(roomKey);unsub();room=null;home()};}
async function boot(){try{questions=await(await fetch('./questions.json')).json();const app=initializeApp(config);db=getFirestore(app);uid=(await signInAnonymously(getAuth(app))).user.uid;const saved=localStorage.getItem(roomKey);if(saved){const s=await getDoc(doc(db,'duels_v2',saved));if(s.exists()&&(s.data().host===uid||s.data().guest===uid)){watch(saved);return}}home()}catch(e){say('Kunne ikke starte: '+e.message);home()}}boot();
</script></body></html>
