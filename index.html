<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personvognsteknik Duel</title><style>body{margin:0;background:#0e1729;color:#f5f8ff;font:16px system-ui}main{max-width:640px;margin:25px auto;padding:20px}h1{font-size:2rem}button,input{font:inherit;border-radius:12px;padding:13px;border:0}button{background:#24c5ad;color:#071727;font-weight:700;cursor:pointer;margin:5px 0}button:disabled{opacity:.45}input{background:#fff;width:90%;margin:7px 0}.panel{background:#1c2b44;padding:20px;border-radius:20px;margin:16px 0}.answer{display:block;width:100%;text-align:left;background:#314565;color:white;margin:9px 0}.muted{color:#b5c7da}.good{color:#67e8a4}.bad{color:#ff9e9e}#status{min-height:20px}code{color:#67e8a4;font-size:1.4em}</style><main><h1>🔧 Personvognsteknik Duel</h1><p class="muted">To telefoner · samme rum · spørgsmål fra din Excel-fil</p><div id="status"></div><div id="app">Indlæser…</div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,setDoc,getDoc,onSnapshot,updateDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
// UDFYLD DISSE VÆRDIER FRA FIREBASE -> PROJEKTINDSTILLINGER -> WEBAPP
const firebaseConfig = {apiKey:"AIzaSyCla_rNEnK9UTQ5kNTVmVlOlORD71JjI1A",authDomain:"auto-quiz-9f924.firebaseapp.com",projectId:"auto-quiz-9f924",storageBucket:"auto-quiz-9f924.firebasestorage.app",messagingSenderId:"673795261314",appId:"1:673795261314:web:d89d4327aa8038d5bac59b",measurementId:"G-J5KN97WVMX"};
const appEl=document.querySelector('#app'),status=document.querySelector('#status');let db,uid,roomId='',room=null,questions=[];const key='personvogn_duel_room', playerKey='personvogn_duel_player';let player=localStorage.getItem(playerKey)||'';
function say(s){status.textContent=s}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function home(){appEl.innerHTML=`<div class="panel"><h2>Start eller fortsæt</h2><input id="name" placeholder="Dit spillernavn" value="${esc(player)}"><button id="create">Opret duel</button><p>eller deltag i en duel:</p><input id="code" placeholder="Rumkode (6 tegn)" maxlength="6"><button id="join">Deltag</button><p class="muted">Når I først har valgt et rum, husker denne telefon rumkoden.</p></div>`;document.querySelector('#create').onclick=()=>enter(true);document.querySelector('#join').onclick=()=>enter(false)}
async function enter(create){try{player=document.querySelector('#name').value.trim().slice(0,30);if(!player)throw Error('Skriv dit navn først.');localStorage.setItem(playerKey,player);const code=create?Math.random().toString(36).slice(2,8).toUpperCase():document.querySelector('#code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))throw Error('Rumkoden skal være 6 tegn.');const ref=doc(db,'duels',code);const snap=await getDoc(ref);if(create){if(snap.exists())throw Error('Prøv at oprette rummet igen.');await setDoc(ref,{host:uid,guest:null,names:{[uid]:player},index:0,answers:{},scores:{[uid]:0},createdAt:Date.now()})}else{if(!snap.exists())throw Error('Rummet findes ikke.');const d=snap.data();if(uid!==d.host&&uid!==d.guest){if(d.guest)throw Error('Rummet har allerede to spillere.');await updateDoc(ref,{guest:uid,[`names.${uid}`]:player,[`scores.${uid}`]:0})}}localStorage.setItem(key,code);watch(code)}catch(e){say(e.message)}}
let unsubscribe;function watch(code){roomId=code;if(unsubscribe)unsubscribe();unsubscribe=onSnapshot(doc(db,'duels',code),s=>{if(!s.exists()){localStorage.removeItem(key);home();return}room=s.data();render()},e=>say(e.message))}
function render(){if(!room)return;const ids=[room.host,room.guest].filter(Boolean),i=room.index,q=questions[i%questions.length],both=ids.length===2,answered=ids.every(id=>room.answers?.[id]!==undefined),mine=room.answers?.[uid];let html=`<div class="panel"><div>Rumkode: <code>${esc(roomId)}</code></div><p class="muted">Gem denne kode én gang. Begge kan åbne samme faste spiladresse.</p><p>${ids.map(id=>`${esc(room.names?.[id]||'Spiller')}: <b>${room.scores?.[id]||0} point</b>`).join(' · ')}</p><button id="leave">Skift rum på denne telefon</button></div>`;
if(!both)html+=`<div class="panel">Venter på spiller 2. Send rumkoden <b>${esc(roomId)}</b> én gang.</div>`;
else if(!q)html+=`<div class="panel">Ingen spørgsmål indlæst.</div>`;
else{html+=`<div class="panel"><p class="muted">Spørgsmål ${i+1} · ${q.seconds} sekunder anbefalet</p><h2>${esc(q.question)}</h2>`;q.answers.forEach((a,j)=>{if(a)html+=`<button class="answer" data-answer="${j}" ${mine!==undefined?'disabled':''}>${j+1}. ${esc(a)}</button>`});html+=`<p>${mine===undefined?'Vælg dit svar.':answered?'Begge har svaret.':'Dit svar er registreret. Venter på den anden.'}</p>`;if(answered){html+=`<p class="good">Rigtigt svar: ${q.correct.map(j=>esc(q.answers[j])).join(' / ')}</p><p>${ids.map(id=>`${esc(room.names?.[id])}: ${room.answers[id]===q.correct[0]?'✓':'✗'}`).join(' · ')}</p>`;if(uid===room.host)html+=`<button id="next">Næste spørgsmål</button>`;else html+=`<p>Venter på, at værten går videre.</p>`}html+='</div>'}
appEl.innerHTML=html;document.querySelector('#leave').onclick=()=>{localStorage.removeItem(key);unsubscribe();room=null;home()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));if(document.querySelector('#next'))document.querySelector('#next').onclick=next}
async function answer(n){if(room.answers?.[uid]!==undefined)return;const q=questions[room.index%questions.length];try{await updateDoc(doc(db,'duels',roomId),{[`answers.${uid}`]:n,[`scores.${uid}`]:(room.scores?.[uid]||0)+(q.correct.includes(n)?1:0)})}catch(e){say(e.message)}}
async function next(){try{await updateDoc(doc(db,'duels',roomId),{index:room.index+1,answers:{}})}catch(e){say(e.message)}}
async function boot(){try{questions=await(await fetch('./questions.json')).json();if(firebaseConfig.apiKey.startsWith('INDSÆT')){say('Firebase skal forbindes først. Se VEJLEDNING.txt.');appEl.innerHTML='<div class="panel">Spillet og spørgsmålene er klar. Firebase-indstillinger mangler, før to telefoner kan spille sammen.</div>';return}const app=initializeApp(firebaseConfig);db=getFirestore(app);const a=await signInAnonymously(getAuth(app));uid=a.user.uid;const saved=localStorage.getItem(key);if(saved){const s=await getDoc(doc(db,'duels',saved));if(s.exists()&&(s.data().host===uid||s.data().guest===uid)){watch(saved);return}}home()}catch(e){say('Kunne ikke starte: '+e.message);home()}}boot();
</script></html>
